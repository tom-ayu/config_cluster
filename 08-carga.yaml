apiVersion: apps/v1
kind: Deployment
metadata:
  name: carga
  namespace: lab-excalidraw
spec:
  replicas: 3
  selector:
    matchLabels:
      app: carga
  template:
    metadata:
      labels:
        app: carga
    spec:
      containers:
        - name: carga
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do wget -q -O- http://excalidraw >/dev/null; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 32Mi }
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: excalidraw-rs
  namespace: lab-excalidraw
spec:
  replicas: 2
  selector:
    matchLabels:
      app: excalidraw-rs
  template:
    metadata:
      labels:
        app: excalidraw-rs
    spec:
      containers:
        - name: excalidraw
          image: excalidraw/excalidraw:latest
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          env:
            - name: VERSION
              value: "2"
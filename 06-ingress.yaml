apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: excalidraw
  namespace: lab-excalidraw
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - excalidraw.local
      secretName: excalidraw-tls
  rules:
    - host: excalidraw.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: excalidraw
                port:
                  number: 80